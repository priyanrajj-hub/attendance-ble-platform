name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: attendance_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Apply database migrations
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/attendance_db
          SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/attendance_db

      - name: Run backend pytest suite
        run: |
          cd backend
          pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/attendance_db
          SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/attendance_db

      - name: Set up Java 21 for Firestore Emulator and Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'firestore-tests/package-lock.json'

      - name: Install Firestore rules test dependencies
        working-directory: firestore-tests
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore security rules test suite
        run: firebase emulators:exec --only firestore "cd firestore-tests && npm test"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Unit and Widget Tests
        run: flutter test --coverage

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amrita-attendance-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
