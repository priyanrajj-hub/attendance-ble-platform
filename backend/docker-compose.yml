version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: attendance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/attendance_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/attendance_db
      - FIREBASE_PROJECT_ID=attendance-ble-test
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
